<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SAKU PHOTO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <header class="site-header">
    <a class="logo" href="#">SAKU PHOTO</a>
    <nav class="nav">
      <a href="#gallery">GALLERY</a>
      <a href="#about">ABOUT</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <div class="hero-photo photo-placeholder hero-placeholder"></div>

      <div class="hero-copy">
        <p class="eyebrow">PHOTOGRAPHS / NAGOYA, JAPAN</p>
        <h1>日々の途中で、<br>立ち止まった景色。</h1>
        <p class="hero-text">
          街、夜、空、鳥、花、ときどき猫。<br>
          「きれい」と思った瞬間を残していく、小さな写真置き場。
        </p>
      </div>
    </section>

    <section id="gallery" class="gallery-section">
      <div class="section-heading">
        <div>
          <p class="eyebrow">GALLERY</p>
          <h2>Photographs</h2>
        </div>

        <div class="filters" aria-label="写真カテゴリ">
          <button class="filter active" data-filter="all">ALL</button>
          <button class="filter" data-filter="birds">BIRDS</button>
          <button class="filter" data-filter="sky">SKY</button>
          <button class="filter" data-filter="nature">NATURE</button>
          <button class="filter" data-filter="city">CITY</button>
          <button class="filter" data-filter="night">NIGHT</button>
          <button class="filter" data-filter="animals">ANIMALS</button>
          <button class="filter" data-filter="landscape">LANDSCAPE</button>
        </div>
      </div>

      <div class="gallery-grid">

        <button class="gallery-item" data-category="birds city" data-title="Crow" data-meta="BIRDS / CITY">
          <div class="photo-placeholder p1"></div>
          <span class="item-info"><b>Crow</b><small>BIRDS / CITY</small></span>
        </button>

        <button class="gallery-item wide" data-category="sky night" data-title="Full Moon" data-meta="SKY / NIGHT">
          <div class="photo-placeholder p2"></div>
          <span class="item-info"><b>Full Moon</b><small>SKY / NIGHT</small></span>
        </button>

        <button class="gallery-item" data-category="birds city" data-title="Takeoff" data-meta="BIRDS / CITY">
          <div class="photo-placeholder p3"></div>
          <span class="item-info"><b>Takeoff</b><small>BIRDS / CITY</small></span>
        </button>

        <button class="gallery-item" data-category="birds nature" data-title="In the Green" data-meta="BIRDS / NATURE">
          <div class="photo-placeholder p4"></div>
          <span class="item-info"><b>In the Green</b><small>BIRDS / NATURE</small></span>
        </button>

        <button class="gallery-item wide" data-category="birds city" data-title="Watching" data-meta="BIRDS / CITY">
          <div class="photo-placeholder p5"></div>
          <span class="item-info"><b>Watching</b><small>BIRDS / CITY</small></span>
        </button>

        <button class="gallery-item" data-category="nature" data-title="Hydrangea" data-meta="NATURE">
          <div class="photo-placeholder p6"></div>
          <span class="item-info"><b>Hydrangea</b><small>NATURE</small></span>
        </button>

        <button class="gallery-item" data-category="birds nature" data-title="Waterside" data-meta="BIRDS / NATURE">
          <div class="photo-placeholder p7"></div>
          <span class="item-info"><b>Waterside</b><small>BIRDS / NATURE</small></span>
        </button>

        <button class="gallery-item wide" data-category="sky night landscape" data-title="Stars" data-meta="SKY / NIGHT / LANDSCAPE">
          <div class="photo-placeholder p8"></div>
          <span class="item-info"><b>Stars</b><small>SKY / NIGHT / LANDSCAPE</small></span>
        </button>

        <button class="gallery-item wide" data-category="city night" data-title="Coffee Shop" data-meta="CITY / NIGHT">
          <div class="photo-placeholder p9"></div>
          <span class="item-info"><b>Coffee Shop</b><small>CITY / NIGHT</small></span>
        </button>

        <button class="gallery-item tall" data-category="animals city" data-title="Cat" data-meta="ANIMALS / CITY">
          <div class="photo-placeholder p10"></div>
          <span class="item-info"><b>Cat</b><small>ANIMALS / CITY</small></span>
        </button>

        <button class="gallery-item" data-category="sky night" data-title="Moon" data-meta="SKY / NIGHT">
          <div class="photo-placeholder p11"></div>
          <span class="item-info"><b>Moon</b><small>SKY / NIGHT</small></span>
        </button>

        <button class="gallery-item wide" data-category="landscape sky" data-title="Torii at Dusk" data-meta="LANDSCAPE / SKY">
          <div class="photo-placeholder p12"></div>
          <span class="item-info"><b>Torii at Dusk</b><small>LANDSCAPE / SKY</small></span>
        </button>

      </div>
    </section>

    <section id="about" class="about">
      <p class="eyebrow">ABOUT</p>
      <div class="about-grid">
        <h2>好きな景色を、<br>好きなまま。</h2>
        <p>
          上手く撮れた日も、ちょっと違った日も。<br>
          出かけた先で見つけた光や空気を、気ままに残しています。
        </p>
      </div>
    </section>
  </main>

  <footer>
    <span>© 2026 SAKU PHOTO</span>
    <a href="#">BACK TO TOP ↑</a>
  </footer>

  <dialog class="lightbox" id="lightbox">
    <button class="close-button" id="closeLightbox" aria-label="閉じる">×</button>
    <div class="lightbox-image photo-placeholder" id="lightboxImage"></div>
    <div class="lightbox-caption">
      <strong id="lightboxTitle"></strong>
      <span id="lightboxMeta"></span>
    </div>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
