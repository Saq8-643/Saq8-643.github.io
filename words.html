<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>言葉の化石置き場 / Saq8</title>

  <meta
    name="description"
    content="意味になる前の言葉を、忘れないうちに埋めておく。"
  >

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+JP:wght@400;500&display=swap"
    rel="stylesheet"
  >


  <style>

    :root {
      --bg: #f3f2ee;
      --paper: #f9f8f4;
      --text: #171717;
      --muted: #7c7a73;
      --line: rgba(23, 23, 23, .12);

      --purple: #938aaa;
    }


    * {
      box-sizing: border-box;
    }


    html {
      scroll-behavior: smooth;
    }


    body {
      margin: 0;

      background:
        linear-gradient(
          180deg,
          #f5f4f0 0%,
          #efeee9 100%
        );

      color: var(--text);

      font-family:
        "Inter",
        "Noto Sans JP",
        sans-serif;

      -webkit-font-smoothing:
        antialiased;
    }


    button,
    a {
      font: inherit;
    }


    button {
      color: inherit;
    }


    /* ==============================
       HEADER
    ============================== */

    .site-header {
      position: relative;
      z-index: 10;

      display: flex;
      justify-content: space-between;
      align-items: center;

      width: min(
        1180px,
        calc(100% - 48px)
      );

      margin: 0 auto;
      padding: 30px 0;
    }


    .logo {
      color: var(--text);

      font-size: 11px;
      font-weight: 600;
      letter-spacing: .16em;

      text-decoration: none;
    }


    .back-link {
      color: var(--muted);

      font-size: 9px;
      font-weight: 600;
      letter-spacing: .16em;

      text-decoration: none;

      transition:
        color .2s ease;
    }


    .back-link:hover {
      color: var(--text);
    }


    /* ==============================
       HERO
    ============================== */

    .hero {
      width: min(
        1180px,
        calc(100% - 48px)
      );

      margin: 80px auto 140px;
    }


    .eyebrow {
      margin: 0 0 18px;

      color: var(--muted);

      font-size: 9px;
      font-weight: 600;
      letter-spacing: .2em;
    }


    h1 {
      max-width: 850px;

      margin:
        0 0 36px;

      font-family:
        "Noto Sans JP",
        sans-serif;

      font-size:
        clamp(
          38px,
          7vw,
          92px
        );

      font-weight: 400;

      line-height: 1.12;

      letter-spacing: -.055em;
    }


    .hero-copy {
      max-width: 480px;

      margin: 0;

      color: var(--muted);

      font-size: 12px;
      line-height: 2;
    }


    .dig-button {
      position: relative;

      margin-top: 44px;

      padding:
        14px 24px;

      border:
        1px solid
        rgba(23, 23, 23, .45);

      background:
        transparent;

      color: var(--text);

      font-size: 10px;
      font-weight: 600;
      letter-spacing: .16em;

      cursor: pointer;

      overflow: hidden;

      transition:
        background .25s ease,
        color .25s ease;
    }


    .dig-button:hover {
      background: var(--text);
      color: var(--paper);
    }


    /* ==============================
       ARCHIVE
    ============================== */

    .archive {
      width: min(
        920px,
        calc(100% - 48px)
      );

      margin:
        0 auto 160px;
    }


    .archive-heading {
      display: flex;
      justify-content: space-between;
      align-items: end;

      gap: 24px;

      margin-bottom: 60px;
      padding-bottom: 18px;

      border-bottom:
        1px solid
        var(--line);
    }


    .archive-heading h2 {
      margin: 0;

      font-size:
        clamp(
          26px,
          4vw,
          44px
        );

      font-weight: 400;

      letter-spacing: -.04em;
    }


    .archive-count {
      color: var(--muted);

      font-size: 9px;
      letter-spacing: .16em;
    }


    .fossil-list {
      display: flex;
      flex-direction: column;

      gap: 0;
    }


    .fossil {
      position: relative;

      padding:
        70px 0 72px;

      border-bottom:
        1px solid
        var(--line);
    }


    .fossil:first-child {
      border-top:
        1px solid
        var(--line);
    }


    .fossil-head {
      display: flex;
      justify-content: space-between;
      align-items: center;

      gap: 20px;

      margin-bottom: 34px;
    }


    .fossil-id {
      color: var(--muted);

      font-size: 9px;
      font-weight: 600;
      letter-spacing: .18em;
    }


    .fossil-date {
      color: var(--muted);

      font-size: 9px;
      letter-spacing: .1em;
    }


    .fossil-text {
      max-width: 760px;

      margin: 0;

      font-family:
        "Noto Sans JP",
        sans-serif;

      font-size:
        clamp(
          18px,
          2.5vw,
          28px
        );

      font-weight: 400;

      line-height: 2;

      letter-spacing: -.015em;

      white-space: pre-line;
    }


    .fossil-mark {
      position: absolute;

      right: 0;
      bottom: 48px;

      color:
        rgba(23, 23, 23, .055);

      font-size: 80px;
      font-weight: 500;
      line-height: 1;

      pointer-events: none;
    }


    /* ==============================
       FOOTER
    ============================== */

    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;

      width: min(
        1180px,
        calc(100% - 48px)
      );

      margin: 0 auto;

      padding:
        40px 0 50px;

      border-top:
        1px solid
        var(--line);

      color: var(--muted);

      font-size: 8px;
      letter-spacing: .14em;
    }


    footer a {
      color: inherit;
      text-decoration: none;
    }


    /* ==============================
       EXCAVATION
    ============================== */

    .excavation {
      position: fixed;
      inset: 0;
      z-index: 9999;

      display: grid;
      place-items: center;

      padding: 24px;

      background:
        rgba(12, 12, 13, .97);

      color: #f4f2ec;

      opacity: 0;
      visibility: hidden;

      transition:
        opacity .5s ease,
        visibility .5s ease;
    }


    .excavation.is-open {
      opacity: 1;
      visibility: visible;
    }


    .excavation-inner {
      position: relative;

      width:
        min(
          760px,
          100%
        );

      text-align: center;
    }


    .dig-state {
      min-height: 360px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }


    .dig-dots {
      margin-bottom: 28px;

      color:
        rgba(255, 255, 255, .38);

      font-size: 11px;

      letter-spacing: .8em;
    }


    .dig-message {
      margin: 0;

      color:
        rgba(255, 255, 255, .62);

      font-size: 10px;
      letter-spacing: .14em;
    }


    .found {
      display: none;

      animation:
        fossil-appear
        1.3s
        cubic-bezier(
          .2,
          .8,
          .2,
          1
        )
        forwards;
    }


    .found.is-visible {
      display: block;
    }


    .found-id {
      margin-bottom: 34px;

      color:
        rgba(255, 255, 255, .38);

      font-size: 9px;
      font-weight: 600;

      letter-spacing: .2em;
    }


    .found-text {
      margin:
        0 auto 38px;

      font-family:
        "Noto Sans JP",
        sans-serif;

      font-size:
        clamp(
          20px,
          4vw,
          36px
        );

      font-weight: 400;

      line-height: 1.9;

      letter-spacing: -.02em;

      white-space: pre-line;
    }


    .found-date {
      color:
        rgba(255, 255, 255, .42);

      font-size: 9px;

      letter-spacing: .12em;
    }


    .excavation-actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;

      gap: 12px;

      margin-top: 50px;
    }


    .excavation-actions button {
      padding:
        12px 18px;

      border:
        1px solid
        rgba(255, 255, 255, .28);

      background:
        transparent;

      color: #f4f2ec;

      font-size: 9px;
      font-weight: 600;
      letter-spacing: .14em;

      cursor: pointer;

      transition:
        border-color .2s ease,
        background .2s ease;
    }


    .excavation-actions button:hover {
      border-color:
        rgba(255, 255, 255, .8);

      background:
        rgba(255, 255, 255, .06);
    }


    .excavation-close {
      position: absolute;

      top: 28px;
      right: 28px;

      width: 42px;
      height: 42px;

      border: 0;

      background:
        transparent;

      color:
        rgba(255, 255, 255, .6);

      font-size: 24px;
      font-weight: 300;

      cursor: pointer;
    }


    .dust {
      position: fixed;

      z-index: 10000;

      width: 3px;
      height: 3px;

      border-radius: 50%;

      background:
        rgba(255, 255, 255, .45);

      pointer-events: none;

      animation:
        dust-fall
        1.6s
        ease-out
        forwards;
    }


    @keyframes fossil-appear {

      from {
        opacity: 0;

        transform:
          translateY(14px);

        filter:
          blur(8px);
      }

      to {
        opacity: 1;

        transform:
          translateY(0);

        filter:
          blur(0);
      }
    }


    @keyframes dust-fall {

      from {
        opacity: 0;

        transform:
          translate(
            0,
            -10px
          )
          scale(.5);
      }

      20% {
        opacity: .8;
      }

      to {
        opacity: 0;

        transform:
          translate(
            var(--dx),
            var(--dy)
          )
          scale(1.4);
      }
    }


    /* ==============================
       MOBILE
    ============================== */

    @media (
      max-width: 700px
    ) {

      .site-header {
        width:
          calc(100% - 32px);

        padding-top: 22px;
      }


      .hero {
        width:
          calc(100% - 32px);

        margin:
          60px auto 100px;
      }


      .archive {
        width:
          calc(100% - 32px);

        margin-bottom: 110px;
      }


      .archive-heading {
        align-items: start;

        flex-direction: column;
      }


      .fossil {
        padding:
          50px 0 54px;
      }


      .fossil-text {
        font-size: 18px;
        line-height: 2;
      }


      .fossil-mark {
        bottom: 25px;

        font-size: 55px;
      }


      footer {
        width:
          calc(100% - 32px);
      }


      .found-text {
        font-size: 21px;
      }


      .excavation-close {
        top: 15px;
        right: 15px;
      }

    }

  </style>

</head>


<body>


  <!-- ==============================
       HEADER
  =============================== -->

  <header class="site-header">

    <a
      href="index.html"
      class="logo"
    >
      Saq8
    </a>

    <a
      href="index.html"
      class="back-link"
    >
      ← PHOTO
    </a>

  </header>



  <!-- ==============================
       HERO
  =============================== -->

  <main>

    <section class="hero">

      <p class="eyebrow">
        WORDS / FOSSIL ARCHIVE
      </p>


      <h1>
        言葉の<br>
        化石置き場
      </h1>


      <p class="hero-copy">
        意味になる前の言葉を、<br>
        忘れないうちに埋めておく。<br><br>
        ときどき掘り返す。
      </p>


      <button
        id="digButton"
        class="dig-button"
        type="button"
      >
        発掘する
      </button>

    </section>

<div
  class="hero-fossil-art"
  aria-hidden="true"
>
  <img
    class="hero-dino-fossil"
    src="dino-fossil.png"
    alt=""
  >

  <div class="dino-tracks">
    <span>𓆩</span>
    <span>𓆩</span>
    <span>𓆩</span>
  </div>
</div>

    <!-- ==============================
         ARCHIVE
    =============================== -->

    <section
      class="archive"
      id="archive"
    >

      <div class="archive-heading">

        <div>

          <p class="eyebrow">
            SPECIMEN BOX
          </p>

          <h2>
            標本箱
          </h2>

        </div>


        <span class="archive-count">
          5 FOSSILS
        </span>

      </div>


      <div
        id="fossilList"
        class="fossil-list"
      ></div>

    </section>

  </main>



  <!-- ==============================
       EXCAVATION MODE
  =============================== -->

  <div
    id="excavation"
    class="excavation"
    aria-hidden="true"
  >

    <button
      id="closeExcavation"
      class="excavation-close"
      type="button"
      aria-label="発掘モードを閉じる"
    >
      ×
    </button>


    <div class="excavation-inner">


      <div
        id="digState"
        class="dig-state"
      >

        <div class="dig-dots">
          · · ·
        </div>

        <p
          id="digMessage"
          class="dig-message"
        >
          なにか埋まっている。
        </p>

      </div>



      <div
        id="foundFossil"
        class="found"
      >

        <div
          id="foundId"
          class="found-id"
        ></div>


        <p
          id="foundText"
          class="found-text"
        ></p>


        <div
          id="foundDate"
          class="found-date"
        ></div>


        <div class="excavation-actions">

          <button
            id="digAgain"
            type="button"
          >
            もう一度掘る
          </button>

          <button
            id="backToArchive"
            type="button"
          >
            標本箱へ戻る
          </button>

        </div>

      </div>

    </div>

  </div>



  <!-- ==============================
       FOOTER
  =============================== -->

  <footer>

    <span>
      © 2026 Saq8
    </span>

    <a href="#">
      BACK TO TOP ↑
    </a>

  </footer>



  <script>

    /* ==============================
       FOSSILS
    =============================== */

    const fossils = [

      {
        id: 1,

        date:
          "2026.09.24",

        text:
          `冷蔵庫が紫で、昨日の月曜日が泳いでて、7はプリンだから靴下`
      },


      {
        id: 2,

        date:
          "2026.09.24",

        text:
          `木曜日の端っこに牛乳を置いといたら、たぶん夕方には青くなるから、今日は階段を半分だけ食べて帰る

木曜日の端っこは、金曜日の近くでしょ。金曜日は青より赤色だから、夕方には黄色になると思う。階段を半分食べたら、たどり着けないから、エレベーターを9つ飲んでかえるほうがいい`
      },


      {
        id: 3,

        date:
          "2026.09.24",

        text:
          `水曜日を冷蔵庫で三時間冷やすと、たぶん猫より少し小さくなるから、ポケットに入れて駅まで連れていける`
      },


      {
        id: 4,

        date:
          "2026.09.24",

        text:
          `カーテンはそよ風の食べ残し
白と黄色と青が笑いながら注いでる
ふわふわがくすぐって昼の真ん中`
      },


      {
        id: 5,

        date:
          "2026.09.24",

        text:
          `言葉の化石を散りばめる木曜日の真ん中、
お布団が着陸して夏と秋の二人三脚`
      }

    ];



    /* ==============================
       ELEMENTS
    =============================== */

    const fossilList =
      document.getElementById(
        "fossilList"
      );


    const digButton =
      document.getElementById(
        "digButton"
      );


    const excavation =
      document.getElementById(
        "excavation"
      );


    const closeExcavation =
      document.getElementById(
        "closeExcavation"
      );


    const digState =
      document.getElementById(
        "digState"
      );


    const digMessage =
      document.getElementById(
        "digMessage"
      );


    const foundFossil =
      document.getElementById(
        "foundFossil"
      );


    const foundId =
      document.getElementById(
        "foundId"
      );


    const foundText =
      document.getElementById(
        "foundText"
      );


    const foundDate =
      document.getElementById(
        "foundDate"
      );


    const digAgain =
      document.getElementById(
        "digAgain"
      );


    const backToArchive =
      document.getElementById(
        "backToArchive"
      );


    let lastFossilId =
      null;


    let digTimer =
      null;



    /* ==============================
       HELPERS
    =============================== */

    function fossilNumber(
      id
    ) {

      return (
        "FOSSIL " +
        String(id)
          .padStart(
            4,
            "0"
          )
      );
    }



    /* ==============================
       ARCHIVE RENDER
    =============================== */

    function renderArchive() {

      fossilList.innerHTML =
        "";


      fossils.forEach(
        fossil => {

          const article =
            document.createElement(
              "article"
            );


          article.className =
            "fossil";


          const head =
            document.createElement(
              "div"
            );


          head.className =
            "fossil-head";


          const id =
            document.createElement(
              "span"
            );


          id.className =
            "fossil-id";


          id.textContent =
            fossilNumber(
              fossil.id
            );


          const date =
            document.createElement(
              "span"
            );


          date.className =
            "fossil-date";


          date.textContent =
            `採掘日  ${fossil.date}`;


          const text =
            document.createElement(
              "p"
            );


          text.className =
            "fossil-text";


          text.textContent =
            `「${fossil.text}」`;


          const mark =
            document.createElement(
              "span"
            );


          mark.className =
            "fossil-mark";


          mark.textContent =
            String(
              fossil.id
            )
              .padStart(
                2,
                "0"
              );


          head.append(
            id,
            date
          );


          article.append(
            head,
            text,
            mark
          );


          fossilList.appendChild(
            article
          );
        }
      );
    }



    /* ==============================
       RANDOM FOSSIL
    =============================== */

    function chooseFossil() {

      if (
        fossils.length ===
        1
      ) {

        return fossils[0];
      }


      let fossil;


      do {

        fossil =
          fossils[
            Math.floor(
              Math.random() *
              fossils.length
            )
          ];

      } while (
        fossil.id ===
        lastFossilId
      );


      lastFossilId =
        fossil.id;


      return fossil;
    }



    /* ==============================
       DUST
    =============================== */

    function createDust() {

      const centerX =
        window.innerWidth /
        2;


      const centerY =
        window.innerHeight /
        2;


      for (
        let i = 0;
        i < 32;
        i++
      ) {

        const dust =
          document.createElement(
            "span"
          );


        dust.className =
          "dust";


        dust.style.left =
          `${centerX}px`;


        dust.style.top =
          `${centerY}px`;


        dust.style.setProperty(
          "--dx",

          `${
            (
              Math.random() -
              .5
            ) *
            360
          }px`
        );


        dust.style.setProperty(
          "--dy",

          `${
            (
              Math.random() -
              .5
            ) *
            240
          }px`
        );


        dust.style.animationDelay =
          `${
            Math.random() *
            .25
          }s`;


        document.body.appendChild(
          dust
        );


        dust.addEventListener(
          "animationend",
          () =>
            dust.remove()
        );
      }
    }



    /* ==============================
       EXCAVATION
    =============================== */

    function openExcavation() {

      excavation.classList.add(
        "is-open"
      );


      excavation.setAttribute(
        "aria-hidden",
        "false"
      );


      document.body.style.overflow =
        "hidden";


      startDig();
    }



    function closeDigMode() {

      clearTimeout(
        digTimer
      );


      excavation.classList.remove(
        "is-open"
      );


      excavation.setAttribute(
        "aria-hidden",
        "true"
      );


      document.body.style.overflow =
        "";
    }



    function startDig() {

      clearTimeout(
        digTimer
      );


      foundFossil.classList.remove(
        "is-visible"
      );


      digState.style.display =
        "flex";


      digMessage.textContent =
        "なにか埋まっている。";


      const fossil =
        chooseFossil();


      digTimer =
        setTimeout(
          () => {

            digMessage.textContent =
              "もうすこし。";


            digTimer =
              setTimeout(
                () => {

                  showFoundFossil(
                    fossil
                  );

                },
                700
              );

          },
          850
        );
    }



    function showFoundFossil(
      fossil
    ) {

      digState.style.display =
        "none";


      foundId.textContent =
        fossilNumber(
          fossil.id
        );


      foundText.textContent =
        `「${fossil.text}」`;


      foundDate.textContent =
        `採掘日  ${fossil.date}`;


      foundFossil.classList.add(
        "is-visible"
      );


      createDust();
    }



    /* ==============================
       EVENTS
    =============================== */

    digButton.addEventListener(
      "click",
      openExcavation
    );


    closeExcavation.addEventListener(
      "click",
      closeDigMode
    );


    digAgain.addEventListener(
      "click",
      startDig
    );


    backToArchive.addEventListener(
      "click",
      () => {

        closeDigMode();


        document
          .getElementById(
            "archive"
          )
          .scrollIntoView({
            behavior:
              "smooth"
          });
      }
    );


    excavation.addEventListener(
      "click",
      event => {

        if (
          event.target ===
          excavation
        ) {

          closeDigMode();
        }
      }
    );


    document.addEventListener(
      "keydown",
      event => {

        if (
          event.key ===
            "Escape" &&
          excavation.classList.contains(
            "is-open"
          )
        ) {

          closeDigMode();
        }
      }
    );



    /* ==============================
       GO
    =============================== */

    renderArchive();

  </script>


</body>
</html>
