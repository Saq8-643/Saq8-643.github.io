<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Saq8 PHOTO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=5">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="#">Saq8 PHOTO</a>
    <nav class="nav">
      <a href="#gallery">GALLERY</a>
      <a href="#about">ABOUT</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <div id="heroPhoto" class="hero-photo"></div>

      <div class="hero-copy">
        <p class="eyebrow">PHOTOGRAPHS / JAPAN</p>
        <h1>日々の途中で、<br>立ち止まった景色。</h1>
        <p class="hero-text">
          街、夜、空、鳥、花、ときどき猫。<br>
          「きれい」と思った瞬間を残していく、小さな写真置き場。
        </p>
      </div>
    </section>

    <section id="gallery" class="gallery-section">
      <div class="section-heading">
        <div>
          <p class="eyebrow">GALLERY</p>
          <h2>Photographs</h2>
        </div>
        <div id="filters" class="filters" aria-label="写真カテゴリ"></div>
      </div>

      <div id="galleryGrid" class="gallery-grid"></div>

      <div class="more-wrap">
        <button id="moreButton" class="more-button" type="button">
          MORE <span id="moreCount"></span>
        </button>
      </div>
    </section>

    <section id="about" class="about">
      <p class="eyebrow">ABOUT</p>
      <div class="about-grid">
        <h2>好きな景色を、<br>好きなまま。</h2>
        <p>
          上手く撮れた日も、ちょっと違った日も。<br>
          出かけた先で見つけた光や空気を、気ままに残しています。
        </p>
      </div>
    </section>
  </main>

  <footer>
    <span>© 2026 Saq8 PHOTO</span>
    <a href="#">BACK TO TOP ↑</a>
  </footer>

  <dialog class="lightbox" id="lightbox">
    <button class="close-button" id="closeLightbox" aria-label="閉じる">×</button>
    <img class="lightbox-image" id="lightboxImage" alt="">

    <div class="lightbox-caption">
      <div class="lightbox-main">
        <strong id="lightboxTitle"></strong>
        <div class="lightbox-details">
          <time id="lightboxDate"></time>
          <span id="lightboxPlace"></span>
        </div>
      </div>
      <span id="lightboxMeta"></span>
    </div>
  </dialog>

  <script src="script.js?v=5"></script>
</body>
</html>
